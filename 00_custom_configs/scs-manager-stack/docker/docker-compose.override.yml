# Docker Compose Override for SCS Manager Stack Integration
# This file overrides the base docker-compose.yml to integrate with the main SCS deployment
# It adds Traefik integration, proper networking, and uses parent stack's database

services:
  # Drupal with NGINX
  scs-manager--drupal:
    container_name: scs-manager--drupal
    restart: unless-stopped
    environment:
      # Override to use parent stack's database
      DB_HOST: scs--database
      # Pass through Drupal configuration
      DRUPAL_TRUSTED_HOSTS: ${SCS_MANAGER_DRUPAL_TRUSTED_HOSTS}
      DRUPAL_PROXY_ADDRESSES: ${SCS_MANAGER_DRUPAL_PROXY_ADDRESSES}
    volumes: !override
      - scs-manager--drupal-sites:/opt/drupal/web/sites
      - scs-manager--drupal-custom-modules:/opt/drupal/web/modules/custom
      - ./scs-manager-stack/custom_configs:/opt/drupal/custom_configs
      - ./scs-manager-stack/configs/php-fpm/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
      # Xdebug debug overlay (scs-manager-stack/configs/php/zz-xdebug-debug.ini) is for
      # local development only — do not mount in production (disables OPcache).
      - /srv/backups/scs-manager/snapshots:/var/scs-manager/snapshots
      # Workaround: Mount PHP-FPM config to fix socket issue until image is rebuilt
    networks: !override
      - default
      - reverse-proxy
    ports: !reset []  # Remove port binding, use Varnish with Traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      - scs--reverse-proxy
      - scs--database
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: ${SCS_MANAGER_DOMAIN}", "http://localhost/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      # Internal reverse-proxy traffic: no rate limit (higher priority than external router below).
      - "traefik.http.routers.scs-manager--drupal-internal.rule=Host(`${SCS_MANAGER_DOMAIN}`) && (ClientIP(`172.16.0.0/12`) || ClientIP(`192.168.0.0/16`) || ClientIP(`10.0.0.0/8`) || ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`fd00::/8`))"
      - "traefik.http.routers.scs-manager--drupal-internal.entrypoints=websecure"
      - "traefik.http.routers.scs-manager--drupal-internal.priority=100"
      - "traefik.http.routers.scs-manager--drupal-internal.tls=true"
      - "traefik.http.routers.scs-manager--drupal-internal.tls.certresolver=le"
      - "traefik.http.routers.scs-manager--drupal-internal.service=scs-manager--drupal"
      # External traffic: rate limit to slow scripted scanners and brute-force probes.
      - "traefik.http.routers.scs-manager--drupal.rule=Host(`${SCS_MANAGER_DOMAIN}`)"
      - "traefik.http.routers.scs-manager--drupal.entrypoints=websecure"
      - "traefik.http.routers.scs-manager--drupal.priority=10"
      - "traefik.http.routers.scs-manager--drupal.middlewares=rate-limit-high@docker"
      - "traefik.http.routers.scs-manager--drupal.tls=true"
      - "traefik.http.routers.scs-manager--drupal.tls.certresolver=le"
      - "traefik.http.services.scs-manager--drupal.loadbalancer.server.port=80"


  # Don't start local database - use parent stack's database instead
  scs-manager--database:
    deploy:
      replicas: 0

  # Redis
  scs-manager--redis:
    container_name: scs-manager--redis
    networks:
      - default
    labels:
      - "traefik.enable=false"

  # Varnish disabled - routing directly to Drupal
  scs-manager--varnish:
    deploy:
      replicas: 0

# Networks
networks:
  default:
    name: scs-manager
    driver: bridge

volumes:
  scs-manager--drupal-sites:
    name: scs-manager--drupal-sites
  scs-manager--redis-data:
    name: scs-manager--redis-data
  scs-manager--drupal-custom-modules:
    name: scs-manager--drupal-custom-modules

