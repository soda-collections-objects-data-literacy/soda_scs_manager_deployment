# Docker Compose Override for SCS JupyterHub Stack Integration
# Wave H4: {scope}--{service}--{function}. Alias keeps Today DNS
# (jupyterhub--jupyterhub) until soak. Traefik router label IDs lag.
# JUPYTERHUB_SERVICE_NAME must match container_name (hub_connect_ip).
# Notebook containers are jupyter-project-<gid> (one shared Lab per project).

services:
  jupyterhub--jupyterhub--app:
    container_name: jupyterhub--jupyterhub--app
    build:
      context: jupyterhub/jupyterhub
    env_file: !override
      - ${SCS_ROOT_PATH}/jupyterhub/secret.env
    environment:
      DOCKER_NETWORK: ${JUPYTERHUB_NETWORK}
      JUPYTERHUB_SERVICE_NAME: ${JUPYTERHUB_SERVICE_NAME:-jupyterhub--jupyterhub--app}
      # Override with parent environment variables
      CLIENT_SECRET: ${JUPYTERHUB_CLIENT_SECRET}
      CLIENT_ID: ${JUPYTERHUB_CLIENT_ID}
      # Encrypts auth_state in the hub DB (no longer hardcoded in jupyterhub/).
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
      # SCS Manager service account (REST API: project users and servers).
      JUPYTERHUB_SCS_MANAGER_API_TOKEN: ${JUPYTERHUB_SCS_MANAGER_API_TOKEN}
      # Project servers: stop after this many idle seconds; per-server limits.
      JUPYTERHUB_IDLE_TIMEOUT: ${JUPYTERHUB_IDLE_TIMEOUT:-3600}
      JUPYTERHUB_PROJECT_CPU_LIMIT: ${JUPYTERHUB_PROJECT_CPU_LIMIT:-2}
      JUPYTERHUB_PROJECT_MEM_LIMIT: ${JUPYTERHUB_PROJECT_MEM_LIMIT:-10G}
      # Host root of the sidecar FUSE mounts; project mounts live in _projects/<gid>/<label>.
      NEXTCLOUD_MOUNTS_ROOT: ${NEXTCLOUD_MOUNTS_ROOT:-/var/lib/scs/nextcloud-mounts}
    volumes:
      # Need host FUSE tree visible to Hub for existence checks before bind.
      - type: bind
        source: ${NEXTCLOUD_MOUNTS_ROOT:-/var/lib/scs/nextcloud-mounts}
        target: ${NEXTCLOUD_MOUNTS_ROOT:-/var/lib/scs/nextcloud-mounts}
        bind:
          propagation: rslave
    networks: !override
      reverse-proxy:
        aliases:
          - jupyterhub--jupyterhub
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.jupyterhub--jupyterhub.rule=Host(`${JUPYTERHUB_DOMAIN:-code.${SCS_SUBDOMAIN:-scs}.${SCS_BASE_DOMAIN:-localhost}}`)"
      - "traefik.http.routers.jupyterhub--jupyterhub.entrypoints=websecure"
      - "traefik.http.routers.jupyterhub--jupyterhub.tls=true"
      - "traefik.http.routers.jupyterhub--jupyterhub.tls.certresolver=le"
      - "traefik.http.services.jupyterhub--jupyterhub.loadbalancer.server.port=8000"

  jupyterhub--spawner--builder:
    container_name: jupyterhub--spawner--builder
    build:
      context: jupyterhub/spawner_image
