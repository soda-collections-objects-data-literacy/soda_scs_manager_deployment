worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        port_in_redirect off;

        # Prefer browser language for `/` (fallback: language chooser HTML + JS).
        location = / {
            set $lang_target /de/;
            if ($http_accept_language !~* ^de) {
                set $lang_target /en/;
            }
            if ($http_accept_language = "") {
                set $lang_target /de/;
            }
            return 302 $lang_target;
        }

        # Zensical / MkDocs directory URLs (…/page/ → …/page/index.html).
        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }

        # Fingerprinted via ?v= in zensical.toml; keep CSS/JS fresh for docs deploys.
        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
